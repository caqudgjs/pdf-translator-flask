<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 번역기 - AI 기반 학술 논문 번역</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <i class="fas fa-file-pdf"></i>
                    PDF 번역기
                </h1>
                <p class="subtitle">AI 기반 학술 논문 전문 번역 서비스</p>
            </div>
        </header>

        <main class="main-content">
            <div class="upload-section">
                <div class="upload-card">
                    <div class="upload-header">
                        <h2>PDF 파일 업로드</h2>
                        <p>번역할 PDF 파일을 선택하고 설정을 입력하세요</p>
                    </div>

                    <form id="translateForm" class="translate-form">
                        <div class="file-upload-area" id="fileUploadArea">
                            <div class="upload-icon">
                                <i class="fas fa-cloud-upload-alt"></i>
                            </div>
                            <div class="upload-text">
                                <p class="upload-main-text">PDF 파일을 드래그하거나 클릭하여 선택하세요</p>
                                <p class="upload-sub-text">최대 50MB까지 업로드 가능합니다</p>
                            </div>
                            <input type="file" id="pdfFile" name="file" accept=".pdf" hidden>
                        </div>

                        <div class="file-info" id="fileInfo" style="display: none;">
                            <div class="file-details">
                                <i class="fas fa-file-pdf"></i>
                                <span class="file-name" id="fileName"></span>
                                <span class="file-size" id="fileSize"></span>
                            </div>
                            <button type="button" class="remove-file" id="removeFile">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <div class="form-group">
                            <label for="apiKey">API 키 (OpenAI 또는 Claude) *</label>
                            <input type="password" id="apiKey" name="api_key" required
                                   placeholder="sk-proj- 또는 sk-ant-..." class="form-input">
                            <small class="form-help">OpenAI 또는 Claude API 키를 입력하세요. 키는 서버에 저장되지 않습니다.</small>
                        </div>

                        <div class="form-group">
                            <label for="modelName">모델 선택</label>
                            <select id="modelName" name="model_name" class="form-select">
                                <optgroup label="OpenAI 모델">
                                    <option value="gpt-4o-mini" selected>GPT-4o Mini (권장, 빠름)</option>
                                    <option value="gpt-4o">GPT-4o (고성능)</option>
                                </optgroup>
                                <optgroup label="Claude 모델">
                                    <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku (빠름, 권장)</option>
                                    <option value="claude-3-opus-20240229">Claude 3 Opus (최고 성능)</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="generateKo" name="generate_ko" checked>
                                <span class="checkmark"></span>
                                한국어 음독 자동 생성
                            </label>
                            <small class="form-help">전문 용어의 한국어 발음을 자동으로 생성합니다</small>
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn">
                            <i class="fas fa-language"></i>
                            번역 시작
                        </button>
                    </form>
                </div>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <div class="result-card">
                    <div class="result-header">
                        <h2>번역 결과</h2>
                        <div class="result-actions">
                            <button class="action-btn" id="downloadBtn">
                                <i class="fas fa-download"></i>
                                다운로드
                            </button>
                            <button class="action-btn" id="copyBtn">
                                <i class="fas fa-copy"></i>
                                복사
                            </button>
                        </div>
                    </div>
                    <div class="result-content">
                        <div class="result-tabs">
                            <button class="tab-btn active" data-tab="translation">번역문</button>
                            <button class="tab-btn" data-tab="glossary">용어집</button>
                        </div>
                        <div class="tab-content active" id="translationTab">
                            <div class="translation-text" id="translationText"></div>
                        </div>
                        <div class="tab-content" id="glossaryTab">
                            <div class="glossary-content" id="glossaryContent"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <h3>번역 진행 중...</h3>
                    <p id="loadingMessage">PDF를 분석하고 있습니다...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 PDF 번역기. AI 기반 학술 논문 번역 서비스</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
